<!doctype html>
<html lang="en" class="max-md:overflow-x-hidden max-md:m-0">
  <head>
    <meta charset="utf-8" />

    <!-- Security: restricts what this page may load/execute/embed. Kept in a
         <meta> tag (rather than a response header) since this is a static
         site with no server, so hosts serving it always send it regardless
         of platform. Note frame-ancestors/report-uri/sandbox are ignored
         when CSP is delivered this way — those need a real header, which
         GitHub Pages doesn't support setting. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.sndcdn.com; font-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com; frame-src https://w.soundcloud.com; object-src 'none'; base-uri 'self'; form-action 'self';"
    />

    <!-- Basic -->
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Special Ingredient Bass Mixes" />
    <title>Special Ingredient Bass Mixes</title>

    <!-- Preview. og:image must be absolute — scrapers don't resolve relative
         URLs against the page. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Special Ingredient Bass Mixes" />
    <meta property="og:description" content="Bass mixes from the forest" />
    <meta property="og:url" content="https://specialingredientbass.com" />
    <meta
      property="og:image"
      content="https://specialingredientbass.com/Preview.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#000000" />

    <!-- Icon for favorites -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="bg-black text-white font-[tahoma] max-md:overflow-x-hidden max-md:m-0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
